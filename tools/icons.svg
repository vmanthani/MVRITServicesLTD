<!--
  MVR Tools icon set.
  One 24×24 grid, 1.75 stroke, round caps and joins, currentColor throughout,
  so every icon inherits the theme accent and stays crisp at any size.
  Referenced as <use href="assets/icons.svg#i-name">.
-->
<defs>
  <style>
    symbol { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    symbol .fill { fill: currentColor; stroke: none; }
    symbol .thin { stroke-width: 1.25; }
  </style>
</defs>

